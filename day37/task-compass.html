<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Compass — Tech Company</title>
<style>
  :root{
    --ink:#0a0f1a;
    --panel:rgba(20,28,45,0.72);
    --panel-solid:#131b2c;
    --line:rgba(148,178,255,0.14);
    --text:#e8edf9;
    --dim:#8b97b8;
    --accent:#35d0ba;
    --accent2:#ffb454;
    --danger:#ff7a6e;
    --fe:#5b9dff;
    --be:#35d0ba;
    --qa:#ff7a6e;
    --pm:#ffb454;
    --ux:#c792ea;
    --sup:#6ee7b7;
    --em:#f472b6;
    --radius:16px;
    font-size:16px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(53,208,186,0.10), transparent 60%),
      radial-gradient(1000px 700px at 110% 10%, rgba(255,180,84,0.08), transparent 55%),
      var(--ink);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  .mono{ font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace; }

  /* animated background circuit */
  .bg-grid{
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.35;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: radial-gradient(1100px 700px at 50% 20%, black, transparent 75%);
  }

  .app{ position:relative; z-index:1; max-width:980px; margin:0 auto; padding:28px 20px 80px; }

  header.top{ text-align:center; margin-bottom:22px; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family: ui-monospace, monospace; font-size:12px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--accent); padding:5px 12px;
    border:1px solid rgba(53,208,186,0.35); border-radius:999px;
    background:rgba(53,208,186,0.06);
  }
  h1.title{
    font-size:clamp(2rem, 5vw, 3.1rem); font-weight:800; letter-spacing:-0.02em;
    margin:14px 0 6px;
    background:linear-gradient(120deg,#eef3ff 0%, #a8c8ff 45%, #35d0ba 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .subtitle{ color:var(--dim); font-size:1.02rem; }

  /* progress */
  .progress-wrap{ margin:26px 0 30px; }
  .stage-track{ display:flex; gap:8px; align-items:center; }
  .stage-pill{
    flex:1; display:flex; align-items:center; gap:10px; padding:10px 14px;
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    backdrop-filter: blur(10px); opacity:0.5; transition:.35s;
  }
  .stage-pill.active{ opacity:1; border-color:rgba(53,208,186,0.5); box-shadow:0 0 0 1px rgba(53,208,186,0.15), 0 8px 24px -12px rgba(53,208,186,0.4);}
  .stage-pill.done{ opacity:0.85; }
  .stage-num{
    width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700; background:rgba(255,255,255,0.06); flex-shrink:0;
  }
  .stage-pill.active .stage-num{ background:var(--accent); color:#0a0f1a; }
  .stage-pill.done .stage-num{ background:var(--accent2); color:#0a0f1a; }
  .stage-label{ font-size:13px; font-weight:600; }
  .stage-sub{ font-size:11px; color:var(--dim); }
  .q-dots{ display:flex; gap:5px; margin-top:14px; justify-content:center; }
  .q-dot{ width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,0.14); transition:.3s; }
  .q-dot.on{ background:var(--accent); box-shadow:0 0 8px var(--accent);}

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    padding:26px; animation: rise .45s ease both;
  }
  @keyframes rise{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  /* ticket */
  .ticket{
    position:relative; border-radius:14px; padding:20px 22px;
    background:linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
    border:1px dashed rgba(148,178,255,0.28);
    margin-bottom:24px;
  }
  .ticket::before{
    content:''; position:absolute; left:-8px; top:50%; width:16px; height:16px;
    background:var(--ink); border-radius:50%; transform:translateY(-50%);
    box-shadow: 2px 0 0 1px rgba(148,178,255,0.28) inset;
  }
  .ticket-id{ font-size:11px; color:var(--accent); font-weight:700; letter-spacing:.08em; }
  .ticket-body{ font-size:1.12rem; font-weight:600; margin-top:8px; line-height:1.45; }
  .ticket-tag{
    display:inline-block; margin-top:12px; font-size:11px; padding:4px 10px; border-radius:999px;
    background:rgba(255,180,84,0.12); color:var(--accent2); border:1px solid rgba(255,180,84,0.3);
    font-weight:700; letter-spacing:.04em;
  }

  h2.stage-title{ font-size:1.3rem; margin-bottom:4px; }
  p.stage-desc{ color:var(--dim); font-size:.92rem; margin-bottom:18px; }

  /* role cards */
  .role-pool{ display:flex; flex-wrap:wrap; gap:12px; margin:16px 0 22px; min-height:64px; }
  .role-card{
    display:flex; align-items:center; gap:8px; padding:10px 14px; border-radius:12px;
    background:rgba(255,255,255,0.045); border:1px solid var(--line);
    cursor:grab; user-select:none; font-weight:600; font-size:.92rem;
    transition: transform .18s, box-shadow .18s, opacity .18s;
  }
  .role-card:hover{ transform:translateY(-3px); box-shadow:0 10px 22px -12px rgba(0,0,0,0.6); }
  .role-card:active{ cursor:grabbing; }
  .role-card.dragging{ opacity:0.35; }
  .role-card .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .role-card[data-role="Frontend Developer"] .dot{ background:var(--fe);} 
  .role-card[data-role="Backend Developer"] .dot{ background:var(--be);}
  .role-card[data-role="QA Engineer"] .dot{ background:var(--qa);}
  .role-card[data-role="Product Manager"] .dot{ background:var(--pm);}
  .role-card[data-role="UX Designer"] .dot{ background:var(--ux);}
  .role-card[data-role="Customer Support"] .dot{ background:var(--sup);}
  .role-card[data-role="Engineering Manager"] .dot{ background:var(--em);}
  .role-card[data-role="Data / Security"] .dot{ background:#7dd3fc;}

  /* stage 1 drop slot */
  .own-slot{
    border:2px dashed rgba(53,208,186,0.4); border-radius:14px; min-height:76px;
    display:flex; align-items:center; justify-content:center; color:var(--dim);
    font-size:.88rem; transition:.2s; background:rgba(53,208,186,0.03); margin-bottom:8px;
  }
  .own-slot.over{ background:rgba(53,208,186,0.12); border-color:var(--accent); }
  .own-slot.filled{ border-style:solid; }
  .placed-chip{
    display:flex; align-items:center; gap:8px; padding:8px 16px; border-radius:10px;
    background:rgba(255,255,255,0.07); font-weight:700;
  }

  /* stage 2 pipeline */
  .pipeline{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:18px 0; min-height:64px; }
  .pipe-slot{
    width:150px; min-height:56px; border:2px dashed rgba(148,178,255,0.3); border-radius:12px;
    display:flex; align-items:center; justify-content:center; text-align:center; padding:6px;
    color:var(--dim); font-size:.78rem; transition:.2s; position:relative;
  }
  .pipe-slot.over{ background:rgba(53,208,186,0.12); border-color:var(--accent);}
  .pipe-slot.filled{ border-style:solid; color:var(--text); font-weight:700; font-size:.85rem; }
  .pipe-arrow{ color:var(--dim); font-size:1.1rem; flex-shrink:0; }
  .pipe-step-num{ position:absolute; top:-9px; left:8px; background:var(--ink); color:var(--accent); font-size:10px; padding:0 5px; font-family:ui-monospace,monospace; }

  /* stage 3 assign grid */
  .assign-grid{ display:flex; flex-wrap:wrap; gap:10px; margin:16px 0 20px; }
  .assign-slot{
    width:140px; min-height:70px; border:2px dashed rgba(148,178,255,0.3); border-radius:12px;
    display:flex; align-items:center; justify-content:center; text-align:center; padding:8px;
    color:var(--dim); font-size:.78rem; transition:.2s;
  }
  .assign-slot.over{ background:rgba(255,180,84,0.12); border-color:var(--accent2); }
  .assign-slot.filled{ border-style:solid; color:var(--text); font-weight:700; font-size:.85rem; }

  .btn-row{ display:flex; gap:12px; margin-top:18px; flex-wrap:wrap; }
  button{
    font-family:inherit; font-size:.92rem; font-weight:700; padding:12px 22px; border-radius:11px;
    border:none; cursor:pointer; transition:.18s; letter-spacing:.01em;
  }
  .btn-primary{ background:linear-gradient(120deg,var(--accent),#28b8a4); color:#06231c; }
  .btn-primary:disabled{ opacity:.35; cursor:not-allowed; }
  .btn-primary:not(:disabled):hover{ transform:translateY(-2px); box-shadow:0 10px 24px -10px rgba(53,208,186,0.5); }
  .btn-ghost{ background:rgba(255,255,255,0.06); color:var(--text); border:1px solid var(--line); }
  .btn-ghost:hover{ background:rgba(255,255,255,0.1); }

  /* reveal */
  .reveal{ margin-top:22px; padding-top:20px; border-top:1px solid var(--line); animation: fadeIn .5s ease both; }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  .reveal-row{ display:flex; gap:10px; margin-bottom:12px; align-items:flex-start; }
  .reveal-icon{ font-size:1.1rem; flex-shrink:0; margin-top:1px; }
  .reveal-label{ font-weight:700; font-size:.85rem; color:var(--accent); text-transform:uppercase; letter-spacing:.06em; margin-bottom:3px; }
  .reveal-text{ color:var(--text); font-size:.94rem; line-height:1.5; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
  .chip{ font-size:.78rem; padding:4px 10px; border-radius:999px; background:rgba(255,255,255,0.08); font-weight:600;}

  /* flow animation for stage 2 reveal */
  .flow-track{ display:flex; align-items:center; gap:4px; margin:14px 0 8px; flex-wrap:wrap; }
  .flow-node{ padding:8px 14px; border-radius:10px; background:rgba(255,255,255,0.07); font-size:.82rem; font-weight:700; opacity:0; transform:scale(0.7); }
  .flow-node.pop{ animation: pop .4s ease forwards; }
  @keyframes pop{ to{opacity:1; transform:scale(1);} }
  .flow-line{ height:2px; width:22px; background:var(--dim); opacity:0; }
  .flow-line.pop{ animation: fadeIn .3s ease forwards; }

  /* end screen */
  .end-wrap{ text-align:center; }
  .celebrate{ font-size:3rem; margin-bottom:6px; }
  .chart-wrap{ display:grid; grid-template-columns:1fr; gap:14px; margin:26px 0; text-align:left; }
  .bar-row{ display:flex; align-items:center; gap:12px; }
  .bar-label{ width:150px; font-size:.85rem; font-weight:600; flex-shrink:0; }
  .bar-track{ flex:1; height:14px; border-radius:999px; background:rgba(255,255,255,0.06); overflow:hidden; }
  .bar-fill{ height:100%; border-radius:999px; width:0%; transition:width 1.1s cubic-bezier(.2,.9,.2,1); }
  .bar-val{ width:40px; text-align:right; font-family:ui-monospace,monospace; font-size:.8rem; color:var(--dim); }

  .reflect-grid{ display:grid; grid-template-columns:1fr; gap:14px; text-align:left; margin-top:24px; }
  @media(min-width:680px){ .reflect-grid{ grid-template-columns:1fr 1fr; } }
  .reflect-card{ background:rgba(255,255,255,0.04); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .reflect-card h3{ font-size:.82rem; text-transform:uppercase; letter-spacing:.06em; color:var(--accent2); margin-bottom:8px; }
  .reflect-card p{ font-size:.9rem; line-height:1.5; color:var(--text); }
  .insight-box{
    margin-top:20px; padding:18px 20px; border-radius:14px; text-align:left;
    background:linear-gradient(120deg, rgba(53,208,186,0.1), rgba(255,180,84,0.08));
    border:1px solid rgba(53,208,186,0.25);
    font-size:.98rem; line-height:1.6; font-style:italic;
  }

  .confetti{ position:fixed; top:-10px; z-index:5; pointer-events:none; border-radius:2px; }

  @media (max-width:600px){
    .stage-label{ font-size:11px; } .stage-sub{ display:none; }
    .pipe-slot{ width:110px; }
  }

  ::selection{ background:rgba(53,208,186,0.3); }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="app">
  <header class="top">
    <span class="eyebrow">● Tech Company Simulation</span>
    <h1 class="title">Task Compass</h1>
    <p class="subtitle">Learn how work flows through real organizations.</p>
  </header>

  <div class="progress-wrap">
    <div class="stage-track" id="stageTrack"></div>
    <div class="q-dots" id="qDots"></div>
  </div>

  <div id="root"></div>
</div>

<script>
(function(){

/* ---------------- DATA ---------------- */
const ROLES = ["Frontend Developer","Backend Developer","QA Engineer","Product Manager","UX Designer","Customer Support","Engineering Manager","Data / Security"];

const S1 = [
  { id:"TCK-101", text:"A customer reports that payments fail only on iPhones.", owner:"Frontend Developer",
    why:"The failure is isolated to a specific device/browser environment, which usually points to a client-side rendering or integration bug rather than the payment logic itself.",
    assist:["Backend Developer","QA Engineer"] },
  { id:"TCK-102", text:"The API response time for the checkout endpoint has doubled overnight.", owner:"Backend Developer",
    why:"Server response time is governed by backend services, databases, and infrastructure — the systems backend engineers directly control and monitor.",
    assist:["Engineering Manager","Data / Security"] },
  { id:"TCK-103", text:"A bug that was fixed last month has reappeared in production.", owner:"QA Engineer",
    why:"Regressions are exactly what QA processes exist to catch. QA owns investigating why a previously verified fix didn't hold and tightening the test coverage.",
    assist:["Backend Developer","Frontend Developer"] },
  { id:"TCK-104", text:"Leadership wants to know if the new onboarding flow is worth building this quarter.", owner:"Product Manager",
    why:"Deciding what to build and why is a prioritization and business-value question — the core responsibility of product management.",
    assist:["UX Designer","Engineering Manager"] },
  { id:"TCK-105", text:"Users say the new dashboard is confusing and hard to navigate.", owner:"UX Designer",
    why:"Usability and navigation clarity are design problems first. UX owns researching the confusion and reshaping the interaction, not just the visuals.",
    assist:["Product Manager","Frontend Developer"] },
  { id:"TCK-106", text:"A customer is angry and threatening to cancel their subscription today.", owner:"Customer Support",
    why:"Direct, time-sensitive customer relationships are owned by support, who can de-escalate immediately and loop in others only if a deeper fix is needed.",
    assist:["Engineering Manager","Product Manager"] },
  { id:"TCK-107", text:"Two engineers disagree on which database to use for a new feature and it's blocking progress.", owner:"Engineering Manager",
    why:"Resolving technical disagreements that block a team's progress is a leadership responsibility — someone needs authority to make the call and keep momentum.",
    assist:["Backend Developer"] },
  { id:"TCK-108", text:"A security researcher reports that user emails may be exposed in an API response.", owner:"Data / Security",
    why:"Anything touching data exposure or breach risk needs a security-first response with proper containment steps, even though engineering will implement the fix.",
    assist:["Backend Developer","Engineering Manager"] },
  { id:"TCK-109", text:"The mobile app crashes immediately after the latest update.", owner:"QA Engineer",
    why:"A crash affecting all users after a release points to a release-quality gap — QA owns diagnosing what slipped through and coordinating an urgent fix.",
    assist:["Frontend Developer","Backend Developer"] },
  { id:"TCK-110", text:"Support is fielding the same question 40 times a day about a confusing settings page.", owner:"UX Designer",
    why:"Repeated confusion at scale is a signal the interface itself needs to change, not that each ticket needs a one-off answer.",
    assist:["Customer Support","Product Manager"] }
];

const S2 = [
  { id:"TCK-201", text:"A customer emails saying the app won't let them reset their password.",
    steps:["Customer Support","QA Engineer","Backend Developer","Customer Support"],
    why:"Support triages and reproduces intent, QA confirms it's a real bug, Backend fixes the underlying logic, and Support closes the loop with the customer who reported it." },
  { id:"TCK-202", text:"A new feature idea comes from a sales call: 'clients want bulk CSV export.'",
    steps:["Product Manager","UX Designer","Backend Developer","QA Engineer","Frontend Developer"],
    why:"Product scopes the value and priority, UX shapes the experience, Backend builds the export logic, QA verifies edge cases, and Frontend ships the button and flow users see." },
  { id:"TCK-203", text:"QA finds a security vulnerability while testing a routine release.",
    steps:["QA Engineer","Data / Security","Backend Developer","Engineering Manager"],
    why:"QA flags it immediately to Security for risk assessment, Backend implements the fix under Security's guidance, and the Engineering Manager confirms it's resolved before release." },
  { id:"TCK-204", text:"A customer asks for a refund because a feature they were promised doesn't exist yet.",
    steps:["Customer Support","Product Manager","Customer Support"],
    why:"Support can't make roadmap promises alone, so Product confirms the real status of the feature before Support responds with an accurate, trustworthy answer." },
  { id:"TCK-205", text:"An engineer notices the homepage load time has crept up over several releases.",
    steps:["Backend Developer","Engineering Manager","QA Engineer"],
    why:"The engineer who spotted it investigates root cause, the manager prioritizes the fix against other work, and QA validates performance actually improved before it ships." },
  { id:"TCK-206", text:"A UX researcher discovers users abandon signup at the same step in every test.",
    steps:["UX Designer","Product Manager","Frontend Developer","QA Engineer"],
    why:"UX diagnoses the friction point, Product decides how much to invest in fixing it, Frontend implements the redesigned step, and QA confirms it works across devices." }
];

const S3 = [
  { id:"TCK-301", text:"Customer satisfaction scores suddenly drop across the board this month.",
    primary:"Product Manager",
    support:["Customer Support","Engineering Manager","UX Designer"],
    why:"Product owns understanding *why* satisfaction dropped, but the answer likely spans a mix of real bugs, support response quality, and usability — so it pulls in support data, engineering health, and UX research together.",
    flow:"Customer Support surfaces ticket trends → Product Manager investigates patterns → Engineering Manager checks for recent regressions → UX Designer reviews recent interface changes → Product Manager synthesizes findings into a plan." },
  { id:"TCK-302", text:"Sales increase dramatically after a marketing campaign, and the system starts slowing down.",
    primary:"Engineering Manager",
    support:["Backend Developer","Data / Security","Product Manager"],
    why:"The Engineering Manager coordinates an urgent scaling response, Backend handles the technical load, Security ensures scaling doesn't open new risk, and Product balances speed against stability trade-offs.",
    flow:"Backend Developer reports rising load → Engineering Manager mobilizes response → Data / Security reviews scaling safety → Product Manager decides what can be paused → team ships a fix together." },
  { id:"TCK-303", text:"Negative reviews mentioning 'buggy app' start appearing on app stores.",
    primary:"QA Engineer",
    support:["Product Manager","Customer Support","Backend Developer"],
    why:"QA leads auditing what's actually breaking, Product prioritizes which bugs matter most to reputation, Support gathers real user complaints, and Backend fixes the confirmed issues.",
    flow:"Customer Support compiles complaint themes → QA Engineer reproduces top issues → Backend Developer fixes root causes → Product Manager prioritizes the fix list → public response is coordinated." },
  { id:"TCK-304", text:"A major feature promised to a big client is going to be delayed by three weeks.",
    primary:"Engineering Manager",
    support:["Product Manager","Customer Support","Backend Developer"],
    why:"The Engineering Manager owns an honest timeline assessment, Product decides how to reprioritize scope, Support manages the client relationship, and Backend reports what's realistically achievable.",
    flow:"Backend Developer flags the delay risk → Engineering Manager confirms new timeline → Product Manager adjusts scope options → Customer Support communicates with the client → plan is finalized." }
];

const ROLE_ICON = {
  "Frontend Developer":"🖥️","Backend Developer":"⚙️","QA Engineer":"🔍","Product Manager":"🧭",
  "UX Designer":"🎨","Customer Support":"💬","Engineering Manager":"🧑‍✈️","Data / Security":"🔐"
};

/* ---------------- STATE ---------------- */
let stage = 1; // 1,2,3,4(end)
let qIndex = 0;
let scores = { Ownership:0, Delegation:0, Collaboration:0, Workflow:0 };
let maxScores = { Ownership:9, Delegation:0, Collaboration:0, Workflow:0 };
let overAssignCount = 0, underAssignCount = 0;

const root = document.getElementById('root');
const stageTrack = document.getElementById('stageTrack');
const qDots = document.getElementById('qDots');

const STAGE_META = [
  {label:"Ownership", sub:"Who owns this?"},
  {label:"Routing", sub:"Task routing"},
  {label:"Collaboration", sub:"Team challenge"},
  {label:"Reflection", sub:"Your insights"}
];

function renderProgress(){
  stageTrack.innerHTML = STAGE_META.map((m,i)=>{
    const n = i+1;
    let cls = 'stage-pill';
    if(n < stage) cls += ' done';
    if(n === stage) cls += ' active';
    const icon = n < stage ? '✓' : n;
    return `<div class="${cls}"><div class="stage-num">${icon}</div><div><div class="stage-label">${m.label}</div><div class="stage-sub">${m.sub}</div></div></div>`;
  }).join('');
  if(stage <= 3){
    qDots.style.display='flex';
    qDots.innerHTML = [0,1,2].map(i=> `<div class="q-dot ${i<=qIndex?'on':''}"></div>`).join('');
  } else {
    qDots.style.display='none';
  }
}

/* ---------------- DRAG HELPERS ---------------- */
function makeRolePool(roles, extraAttr){
  const wrap = document.createElement('div');
  wrap.className = 'role-pool';
  roles.forEach(r=>{
    const c = document.createElement('div');
    c.className = 'role-card';
    c.draggable = true;
    c.dataset.role = r;
    c.innerHTML = `<span class="dot"></span>${ROLE_ICON[r]||''} ${r}`;
    c.addEventListener('dragstart', e=>{
      e.dataTransfer.setData('text/plain', r);
      c.classList.add('dragging');
    });
    c.addEventListener('dragend', ()=> c.classList.remove('dragging'));
    wrap.appendChild(c);
  });
  return wrap;
}

function wireDropSlot(slot, onDrop){
  slot.addEventListener('dragover', e=>{ e.preventDefault(); slot.classList.add('over'); });
  slot.addEventListener('dragleave', ()=> slot.classList.remove('over'));
  slot.addEventListener('drop', e=>{
    e.preventDefault();
    slot.classList.remove('over');
    const role = e.dataTransfer.getData('text/plain');
    if(role) onDrop(role);
  });
}

/* ---------------- STAGE 1 ---------------- */
function renderStage1(){
  const task = S1[qIndex];
  let placed = null;

  root.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h2 class="stage-title">Who Owns This?</h2>
    <p class="stage-desc">Drag the role that should be the <strong>primary owner</strong> into the slot below.</p>
    <div class="ticket">
      <div class="ticket-id mono">${task.id}</div>
      <div class="ticket-body">${task.text}</div>
      <span class="ticket-tag">NEEDS OWNER</span>
    </div>
    <div class="own-slot" id="ownSlot">Drop the owning role here</div>
    <div id="rolePoolWrap"></div>
    <div id="revealWrap"></div>
    <div class="btn-row">
      <button class="btn-primary" id="submitBtn" disabled>Submit</button>
      <button class="btn-ghost" id="nextBtn" style="display:none;">Continue →</button>
    </div>
  `;
  root.appendChild(card);

  const pool = makeRolePool(ROLES);
  card.querySelector('#rolePoolWrap').appendChild(pool);

  const slot = card.querySelector('#ownSlot');
  const submitBtn = card.querySelector('#submitBtn');
  const nextBtn = card.querySelector('#nextBtn');

  wireDropSlot(slot, (role)=>{
    placed = role;
    slot.classList.add('filled');
    slot.innerHTML = `<div class="placed-chip">${ROLE_ICON[role]||''} ${role}</div>`;
    submitBtn.disabled = false;
  });

  submitBtn.addEventListener('click', ()=>{
    submitBtn.disabled = true;
    pool.querySelectorAll('.role-card').forEach(c=> c.draggable = false);
    const correct = placed === task.owner;
    if(correct) scores.Ownership += 1;

    const rw = card.querySelector('#revealWrap');
    rw.className = 'reveal';
    rw.innerHTML = `
      <div class="reveal-row">
        <span class="reveal-icon">${correct?'✅':'💡'}</span>
        <div>
          <div class="reveal-label">Primary Owner</div>
          <div class="reveal-text">${ROLE_ICON[task.owner]} <strong>${task.owner}</strong>${correct? ' — that matches what you chose.' : ` — you chose ${placed}, which can play a role too, but isn't the primary owner here.`}</div>
        </div>
      </div>
      <div class="reveal-row">
        <span class="reveal-icon">🧠</span>
        <div>
          <div class="reveal-label">Why they own it</div>
          <div class="reveal-text">${task.why}</div>
        </div>
      </div>
      <div class="reveal-row">
        <span class="reveal-icon">🤝</span>
        <div>
          <div class="reveal-label">Who may assist</div>
          <div class="chips">${task.assist.map(a=>`<span class="chip">${ROLE_ICON[a]||''} ${a}</span>`).join('')}</div>
        </div>
      </div>
    `;
    nextBtn.style.display = 'inline-block';
    nextBtn.textContent = qIndex < S1.length-1 && qIndex < 2 ? 'Next Task →' : (qIndex >= 2 ? 'Continue to Stage 2 →' : 'Next Task →');
  });

  nextBtn.addEventListener('click', ()=>{
    qIndex++;
    if(qIndex >= 3){ stage = 2; qIndex = 0; renderProgress(); renderStage2(); }
    else { renderProgress(); renderStage1(); }
  });

  renderProgress();
}

/* ---------------- STAGE 2 ---------------- */
function renderStage2(){
  const task = S2[qIndex];
  const n = task.steps.length;
  let filled = new Array(n).fill(null);

  root.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h2 class="stage-title">Task Routing</h2>
    <p class="stage-desc">Build the workflow: drag roles into order, left to right, to show how this task should move through the org.</p>
    <div class="ticket">
      <div class="ticket-id mono">${task.id}</div>
      <div class="ticket-body">${task.text}</div>
      <span class="ticket-tag">${n} STEPS NEEDED</span>
    </div>
    <div class="pipeline" id="pipeline"></div>
    <div id="rolePoolWrap"></div>
    <div id="revealWrap"></div>
    <div class="btn-row">
      <button class="btn-primary" id="submitBtn" disabled>Submit Workflow</button>
      <button class="btn-ghost" id="nextBtn" style="display:none;">Continue →</button>
    </div>
  `;
  root.appendChild(card);

  const pipeline = card.querySelector('#pipeline');
  for(let i=0;i<n;i++){
    if(i>0){
      const arrow = document.createElement('div');
      arrow.className='pipe-arrow'; arrow.textContent='→';
      pipeline.appendChild(arrow);
    }
    const slot = document.createElement('div');
    slot.className = 'pipe-slot';
    slot.dataset.index = i;
    slot.innerHTML = `<span class="pipe-step-num">STEP ${i+1}</span>Step ${i+1}`;
    wireDropSlot(slot, (role)=>{
      filled[i] = role;
      slot.classList.add('filled');
      slot.innerHTML = `<span class="pipe-step-num">STEP ${i+1}</span>${ROLE_ICON[role]||''} ${role}`;
      submitBtn.disabled = filled.some(f=>f===null);
    });
    pipeline.appendChild(slot);
  }

  // pool can repeat roles across steps (support may reappear)
  const poolRoles = [...new Set(task.steps)];
  // include a couple distractor roles for challenge
  const distractors = ROLES.filter(r=>!poolRoles.includes(r)).slice(0,2);
  const pool = makeRolePool([...poolRoles, ...distractors].sort(()=>Math.random()-0.5));
  // allow dragging duplicates: clone role card whenever a role in the "steps" list can appear more than once
  card.querySelector('#rolePoolWrap').appendChild(pool);

  const submitBtn = card.querySelector('#submitBtn');
  const nextBtn = card.querySelector('#nextBtn');

  submitBtn.addEventListener('click', ()=>{
    submitBtn.disabled = true;
    pipeline.querySelectorAll('.pipe-slot').forEach(s=> s.style.pointerEvents='none');
    let correctSteps = 0;
    filled.forEach((f,i)=>{ if(f === task.steps[i]) correctSteps++; });
    const ratio = correctSteps / n;
    scores.Workflow += ratio;
    maxScores.Workflow += 1;
    scores.Delegation += ratio;
    maxScores.Delegation += 1;

    const rw = card.querySelector('#revealWrap');
    rw.className = 'reveal';
    rw.innerHTML = `
      <div class="reveal-row">
        <span class="reveal-icon">${ratio===1?'✅':'💡'}</span>
        <div>
          <div class="reveal-label">Correct Match</div>
          <div class="reveal-text">You matched ${correctSteps} of ${n} steps correctly.</div>
        </div>
      </div>
      <div class="reveal-row">
        <span class="reveal-icon">🔀</span>
        <div>
          <div class="reveal-label">How this task actually flows</div>
          <div class="flow-track" id="flowTrack"></div>
        </div>
      </div>
      <div class="reveal-row">
        <span class="reveal-icon">🧠</span>
        <div>
          <div class="reveal-label">Why this order</div>
          <div class="reveal-text">${task.why}</div>
        </div>
      </div>
    `;
    const ft = rw.querySelector('#flowTrack');
    task.steps.forEach((s,i)=>{
      if(i>0){
        const line = document.createElement('div');
        line.className='flow-line';
        ft.appendChild(line);
        setTimeout(()=>line.classList.add('pop'), i*260-80);
      }
      const node = document.createElement('div');
      node.className='flow-node';
      node.textContent = `${ROLE_ICON[s]||''} ${s}`;
      ft.appendChild(node);
      setTimeout(()=>node.classList.add('pop'), i*260);
    });

    nextBtn.style.display = 'inline-block';
    nextBtn.textContent = qIndex >= 2 ? 'Continue to Stage 3 →' : 'Next Task →';
  });

  nextBtn.addEventListener('click', ()=>{
    qIndex++;
    if(qIndex >= 3){ stage = 3; qIndex = 0; renderProgress(); renderStage3(); }
    else { renderProgress(); renderStage2(); }
  });

  renderProgress();
}

/* ---------------- STAGE 3 ---------------- */
function renderStage3(){
  const task = S3[qIndex];
  let assigned = [null,null,null,null];

  root.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h2 class="stage-title">Collaboration Challenge</h2>
    <p class="stage-desc">This situation is bigger than one owner. Assign up to <strong>4</strong> roles who should be involved.</p>
    <div class="ticket">
      <div class="ticket-id mono">${task.id}</div>
      <div class="ticket-body">${task.text}</div>
      <span class="ticket-tag">ORG-WIDE SITUATION</span>
    </div>
    <div class="assign-grid" id="assignGrid"></div>
    <div id="rolePoolWrap"></div>
    <div id="revealWrap"></div>
    <div class="btn-row">
      <button class="btn-primary" id="submitBtn" disabled>Submit Response</button>
      <button class="btn-ghost" id="nextBtn" style="display:none;">Continue →</button>
    </div>
  `;
  root.appendChild(card);

  const grid = card.querySelector('#assignGrid');
  for(let i=0;i<4;i++){
    const slot = document.createElement('div');
    slot.className = 'assign-slot';
    slot.dataset.index = i;
    slot.textContent = i===0 ? 'Role slot 1' : `Role slot ${i+1} (optional)`;
    wireDropSlot(slot, (role)=>{
      if(assigned.includes(role)) return;
      assigned[i] = role;
      slot.classList.add('filled');
      slot.textContent = `${ROLE_ICON[role]||''} ${role}`;
      submitBtn.disabled = assigned.filter(Boolean).length < 1;
    });
    grid.appendChild(slot);
  }

  const pool = makeRolePool(ROLES);
  card.querySelector('#rolePoolWrap').appendChild(pool);

  const submitBtn = card.querySelector('#submitBtn');
  const nextBtn = card.querySelector('#nextBtn');

  submitBtn.addEventListener('click', ()=>{
    submitBtn.disabled = true;
    pool.querySelectorAll('.role-card').forEach(c=> c.draggable = false);
    const chosen = assigned.filter(Boolean);
    const gotPrimary = chosen.includes(task.primary);
    const correctSupportSet = new Set(task.support);
    const supportHits = chosen.filter(r=> r!==task.primary && correctSupportSet.has(r)).length;

    // scoring: collaboration = did they involve multiple relevant roles
    const relevantTotal = 1 + task.support.length; // primary + support
    const relevantChosen = (gotPrimary?1:0) + supportHits;
    const collabRatio = relevantChosen / relevantTotal;
    scores.Collaboration += collabRatio;
    maxScores.Collaboration += 1;
    scores.Ownership += gotPrimary ? 1 : 0;
    maxScores.Ownership += 1;

    if(chosen.length <= 1) underAssignCount++;
    if(chosen.length >= 4 && supportHits < task.support.length - 1) overAssignCount++;

    const rw = card.querySelector('#revealWrap');
    rw.className = 'reveal';
    rw.innerHTML = `
      <div class="reveal-row">
        <span class="reveal-icon">${gotPrimary?'✅':'💡'}</span>
        <div>
          <div class="reveal-label">Primary Owner</div>
          <div class="reveal-text">${ROLE_ICON[task.primary]||''} <strong>${task.primary}</strong> typically leads the response here.</div>
        </div>
      </div>
      <div class="reveal-row">
        <span class="reveal-icon">🤝</span>
        <div>
          <div class="reveal-label">Supporting teams</div>
          <div class="chips">${task.support.map(a=>`<span class="chip">${ROLE_ICON[a]||''} ${a}</span>`).join('')}</div>
        </div>
      </div>
      <div class="reveal-row">
        <span class="reveal-icon">🧠</span>
        <div>
          <div class="reveal-label">Reasoning</div>
          <div class="reveal-text">${task.why}</div>
        </div>
      </div>
      <div class="reveal-row">
        <span class="reveal-icon">🔁</span>
        <div>
          <div class="reveal-label">Possible communication flow</div>
          <div class="reveal-text">${task.flow}</div>
        </div>
      </div>
    `;
    nextBtn.style.display = 'inline-block';
    nextBtn.textContent = qIndex >= 2 ? 'See Your Results →' : 'Next Situation →';
  });

  nextBtn.addEventListener('click', ()=>{
    qIndex++;
    if(qIndex >= 3){ stage = 4; renderProgress(); renderEnd(); }
    else { renderProgress(); renderStage3(); }
  });

  renderProgress();
}

/* ---------------- END SCREEN ---------------- */
function pct(cat){
  const max = maxScores[cat] || 1;
  return Math.round((scores[cat]/max)*100);
}

function renderEnd(){
  const cats = ['Ownership','Delegation','Collaboration','Workflow'];
  const colors = { Ownership:'#5b9dff', Delegation:'#35d0ba', Collaboration:'#ffb454', Workflow:'#c792ea' };

  root.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'card end-wrap';
  card.innerHTML = `
    <div class="celebrate">🧭</div>
    <h2 class="stage-title">You've mapped the org.</h2>
    <p class="stage-desc">Here's how your thinking broke down across four dimensions of workplace understanding.</p>
    <div class="chart-wrap" id="chartWrap"></div>
    <div class="reflect-grid" id="reflectGrid"></div>
    <div class="insight-box" id="insightBox"></div>
    <div class="btn-row" style="justify-content:center;">
      <button class="btn-ghost" id="restartBtn">Play Again</button>
    </div>
  `;
  root.appendChild(card);

  const chartWrap = card.querySelector('#chartWrap');
  cats.forEach(c=>{
    const row = document.createElement('div');
    row.className='bar-row';
    row.innerHTML = `<div class="bar-label">${c}</div><div class="bar-track"><div class="bar-fill" style="background:${colors[c]}"></div></div><div class="bar-val">${pct(c)}%</div>`;
    chartWrap.appendChild(row);
  });
  requestAnimationFrame(()=>{
    setTimeout(()=>{
      chartWrap.querySelectorAll('.bar-fill').forEach((el,i)=>{
        el.style.width = pct(cats[i])+'%';
      });
    }, 80);
  });

  // reflection text — avoid absolute language
  const strongest = cats.reduce((a,b)=> pct(a) >= pct(b) ? a : b);
  const weakest = cats.reduce((a,b)=> pct(a) <= pct(b) ? a : b);

  const reflectGrid = card.querySelector('#reflectGrid');
  reflectGrid.innerHTML = `
    <div class="reflect-card">
      <h3>What you understood well</h3>
      <p>Your strongest area was <strong>${strongest}</strong> (${pct(strongest)}%). This suggests you have a solid instinct for ${strongest==='Ownership'?'identifying who is closest to a problem':strongest==='Delegation'?'sequencing how work should move between people':strongest==='Collaboration'?'recognizing when a problem needs more than one team':'seeing the full path a task travels through an organization'}.</p>
    </div>
    <div class="reflect-card">
      <h3>Where you tended to over-assign</h3>
      <p>${overAssignCount>0 ? `In ${overAssignCount} situation${overAssignCount>1?'s':''}, you brought in more roles than the situation clearly called for. Wide involvement can slow decisions down when fewer people would do.` : `You generally kept your assignments focused rather than looping in more people than needed — a sign of confidence in ownership.`}</p>
    </div>
    <div class="reflect-card">
      <h3>Where you underestimated collaboration</h3>
      <p>${underAssignCount>0 ? `In ${underAssignCount} situation${underAssignCount>1?'s':''}, you assigned just one role to a problem that likely needed a team response. Complex, org-wide issues rarely have a single owner.` : `You tended to involve multiple people where it mattered, which reflects a fairly collaborative approach to problem-solving.`}</p>
    </div>
    <div class="reflect-card">
      <h3>An area to keep exploring</h3>
      <p>Your lowest scoring area was <strong>${weakest}</strong> (${pct(weakest)}%). This doesn't mean you got it "wrong" — it may just be a lens you're less used to thinking through yet.</p>
    </div>
  `;

  card.querySelector('#insightBox').textContent =
    "Many real workplace problems are solved by teams rather than individuals — ownership usually means leading the response, not doing all the work alone.";

  card.querySelector('#restartBtn').addEventListener('click', ()=>{
    stage=1; qIndex=0;
    scores = { Ownership:0, Delegation:0, Collaboration:0, Workflow:0 };
    maxScores = { Ownership:9, Delegation:0, Collaboration:0, Workflow:0 };
    overAssignCount=0; underAssignCount=0;
    renderProgress();
    renderStage1();
  });

  launchConfetti();
}

function launchConfetti(){
  const colors = ['#35d0ba','#ffb454','#5b9dff','#c792ea','#f472b6'];
  for(let i=0;i<40;i++){
    const el = document.createElement('div');
    el.className='confetti';
    const size = 5+Math.random()*6;
    el.style.width = size+'px';
    el.style.height = size+'px';
    el.style.left = Math.random()*100+'vw';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.opacity = 0.85;
    document.body.appendChild(el);
    const duration = 2200 + Math.random()*1800;
    const drift = (Math.random()-0.5)*160;
    el.animate([
      { transform:'translate(0,0) rotate(0deg)', opacity:1 },
      { transform:`translate(${drift}px, 100vh) rotate(${360+Math.random()*360}deg)`, opacity:0.9 }
    ], { duration, easing:'ease-in', delay: Math.random()*400 });
    setTimeout(()=> el.remove(), duration+500);
  }
}

/* ---------------- INIT ---------------- */
renderProgress();
renderStage1();

})();
</script>
</body>
</html>
